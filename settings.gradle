pluginManagement {
    repositories {
        maven {
            // Aliyun mirror of the Gradle Plugin Portal.
            // The official plugins.gradle.org is unreachable from this network
            // (its Cloudflare traffic is hijacked locally, breaking Java's TLS handshake),
            // so plugin resolution is routed through this mirror instead.
            name 'Aliyun Gradle Plugin Mirror'
            url 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        maven {
            // RetroFuturaGradle
            name 'GTNH Maven'
            url 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroup 'com.gtnewhorizons.retrofuturagradle'
            }
        }
        maven {
            // Aliyun mirror of Maven Central (used as fallback for plugin transitive dependencies)
            name 'Aliyun Maven Central Mirror'
            url 'https://maven.aliyun.com/repository/central'
        }
        mavenLocal()
    }
}

plugins {
    // Automatic toolchain provisioning
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Due to an IntelliJ bug, this has to be done
// rootProject.name = archives_base_name
rootProject.name = rootProject.projectDir.getName()
